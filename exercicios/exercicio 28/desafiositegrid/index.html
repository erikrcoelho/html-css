<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio da aula CSS Grid: Shorthands para Itens</title>
    <style>
        *{
            margin: 0px;
            box-sizing: border-box;
            padding: 0px;
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 40px 1fr 40px;
            grid-template-columns: 1fr 150px; gap: 5px;
            text-align: center;
        }
        .caixa{
            background-color: lightgray;
            border: 1px solid black;
           
        }
        #topo{
            
            /*grid-row: 1/2;
            grid-column: 1/4;*/
            grid-area: 1 / 1 / 2 / 3;
        }
        #menu{
            
            /*grid-row: 2/3;
            grid-column: 1/4;*/
            grid-area: 2 / 1 / 3 / 3;
        }
        #principal{
            
            /*grid-row: 3/4;
            grid-column:1/3;*/
            grid-area: 3 / 1 / 4 / 2;
            
        }
        #secundario{
            
            /*grid-row: 3/4;
            grid-column: 3/-2;*/
            grid-area: 3 / 2 / 4 / 3;
        }
        #rodape{
            
            /*grid-row: 4/-1;
            grid-column: -4/4;*/
            grid-area: 4 / 1 / 5 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="caixa" id="topo">
            Topo
        </header>
        <nav class="caixa" id="menu">
            Menu
        </nav>
        <main class="caixa" id="principal">
            Principal
        </main>
        <aside class="caixa" id="secundario">
            Secundario
        </aside>
         <footer class="caixa" id="rodape">
            Rodape
         </footer>
    </div>
</body>
</html>
