<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        div{
            background-color: rgba(170, 170, 170, 0.527);
            height: 200px;
            width: 200px;
            border: 2px solid black;
            text-align: center;
           display: inline-block;
        }
        div:hover{
            background-color: aqua;
            
        }
    </style>
</head>
<body>
    <div id="bloco1">1</div>
    <div id="bloco2">2</div>
    <div id="bloco3">3</div>    
</body>
</html>
