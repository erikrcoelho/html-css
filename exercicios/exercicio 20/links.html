<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        a{
            color: rgb(0, 87, 163);
            font-weight: bold;
            text-decoration: none;
        }
        a:hover{
            text-decoration: underline;
        }
         .special::after{
            content: '⇐';
            color: black;
        }
        .special::before{
            content: '⇒';
            color: black;
        }

    </style>
</head>
<body>
 <h1>Canais do youtube preferidos</h1>
 <ul>
    <li><a href="https://www.youtube.com/@OArquivoObscuro" target="_blank">ArquivoObscuro</a></li>
    <li><a href="https://www.youtube.com/@viniccius13" target="_blank">viniccius13</a></li>
    <li><a href="https://www.youtube.com/@GamesEduUu" target="_blank" class="special">GamesEduuu</a></li>
 </ul>
</body>
</html>
