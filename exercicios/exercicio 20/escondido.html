<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escondendo coisas</title>
    <style>
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        div:hover{
            color: rgb(194, 0, 0);
           
        }
        div > p{
            display: none;
           
        }
        div:hover > p {
            display: block;
            width: 400px;
        }
       
    </style>
</head>
<body>
    <h1>Escondendo coisas</h1>
    <h2>Exemplo:</h2>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        passe o mouse aqui
        <p>texto escondido</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
