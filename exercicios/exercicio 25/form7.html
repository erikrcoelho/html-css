<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Select, datalist e textarea</h1>
    <form action="cadastro.php">
        <p>
            <label for="iest">Estado:</label>
            <select name="estado" id="iest">

            <optgroup label="Regiao Sul">
                <option value="PR">Parana</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="SC">Santa Catarina</option>
            </optgroup>

            </select>
        </p>
        <p>
            <datalist></datalist>
        </p>
        <p>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="mensagem" id="imsg" placeholder="Digite sua mensagem aqui"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
