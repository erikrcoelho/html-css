<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Primeiro Formulario</h1>
    <form action="cadastro.php" autocomplete="off"> <!--O autocomplete="off" serve para desligar a sugestao que aparece no input type text-->
        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome"></p>

        <p><label for="isobrenome">Sobrenome</label> <input type="text" name="sobrenome" id="isobrenome"></p>   <!--name é util para html e php, id é util para javascript-->

        <p><label for="iendereco">Endereço:</label> <input type="text" name="endereco" id="iendereco"></p>

        
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
