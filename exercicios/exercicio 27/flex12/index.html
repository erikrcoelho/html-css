<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A propriedade flex </title>
   <style>
        div.conteiner{
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: bisque;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
        }
        div#cxA{
            flex: 2 0 100px;
        }
        div#cxB{
            flex: 1 0 100px;
        }
        div#cxC{
           flex: 2 1 100px;
        }
   </style>
</head>
<body>
    <h1>Testando shorthand da tag flex</h1>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
