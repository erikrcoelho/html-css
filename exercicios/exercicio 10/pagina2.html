<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link e Ancoras</title>
</head>
<body>
<h1>Esta é a segunda pagina</h1> 
<p>clique <a href="index.html"rel="prev">aqui</a> para voltar</p>              
                                                                                    <!--usar: rel= next/prev para o google  entender que aquele link  expecifico é a proxima pagina do meu site-->
<p>esta pagina é um oferecimento de <a href="https://www.hostnet.com.br/" target="_blank" rel="nofollow">Hostnet</a></p>
                                                                                        <!--nofollow: serve para sinalizar aos mecanismos de pesquisa que você não está tentando usar esses links como um método de publicidade-->
                                                                                        <!--dofollow: Links dofollow, ou simplesmente links follow, passam a autoridade de uma página para outra, dizendo aos mecanismos de busca que eles devem apontar de volta para outro site ou postagem de blog.-->
</body>
</html>
