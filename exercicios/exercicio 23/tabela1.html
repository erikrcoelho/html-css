<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 1</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        td{
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
            
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr.linha{
            background-color: rgba(133, 136, 139, 0.589);
        }
        td.verde{
            background-color: rgba(0, 77, 17, 0.582);
        }
       tr.ricos{
        background-color: rgba(255, 255, 0, 0.678);
       }
       tr.pobres{
        background-color: rgba(109, 68, 15, 0.568);
       }
    </style>
</head>
<body>
    <h1>Primeira tabela</h1>
    <table>
        <tr>
            <td class="verde">A1
            <td>B1
            <td>C1
        
        <tr class="linha">
            <td>A2
            <td>B2
            <td>C2
        
        <tr>
            <td class="verde">A3
            <td>B3
            <td class="verde">C3
        
    </table>

    <table>
        <tr class="ricos">
            <td>Inglaterra</td>
            <td>Canada</td>
            <td>França</td>
        </tr>

        <tr class="pobres">
            <td>Monaco</td>
            <td>Islandia</td>
            <td>Grecia</td>
        </tr>
    </table>
</body>
</html>
