<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 1</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
            height: 400px;
        }

        td{
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
            text-align: center;
            vertical-align: bottom;

        }
        
       .numero{
        text-align: right;
       }
    </style>
</head>
<body>
    <h1>Primeira tabela</h1>
    <table>
        <tr>
            <td class="numero">A1
            <td>B1
            <td>C1
        
        <tr>
            <td class="numero">A2
            <td>B2
            <td>C2
        
        <tr>
            <td class="numero">A3
            <td>B3
            <td>C3
        
    </table>

</body>
</html>
