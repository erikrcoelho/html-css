<head>

    <title>Testando iframe</title>
    <style>
        iframe{
            width: 600px;
            height: 600px;
            border: 1px groove black;
            
        }
    </style>
</head>
<body>
    <h1>Testando o uso do iframe</h1>

        </iframe>
        para ficar pro player</p>

        <p>Acessando o site do
            <iframe src="https://forza.net/" frameborder="0">

            </iframe>
            para jogar forza</p>

            
</body>
